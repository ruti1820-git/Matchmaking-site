<div class="container">

  <h2>רשימת בנים</h2>

  <!-- פילטרים -->
  <div class="filters">
    <input type="text" placeholder="שם" [(ngModel)]="searchName" />
    <input type="number" placeholder="גיל" [(ngModel)]="searchAge" />
    <input type="text" placeholder="עיר" [(ngModel)]="searchCity" />
    <input type="text" placeholder="עדה" [(ngModel)]="searchTribe" />
  </div>

  <div class="cards">

    <div *ngFor="let boy of filteredBoys" class="card">

      <img
        *ngIf="boy.image_url"
        [src]="getImageUrl(boy.image_url)"
        class="avatar"
        (click)="openImage(getImageUrl(boy.image_url))"
      />

      <div class="info">

        <h3>{{ boy.name }}</h3>

        <p>🎂 גיל: {{ boy.age || 'לא צויין' }}</p>
        <p>📍 עיר: {{ boy.city || 'לא צויין' }}</p>
        <p>🧬 עדה: {{ boy.tribe || 'לא צויין' }}</p>

        <a
          *ngIf="boy.resume_url"
          [href]="getPdfUrl(boy.resume_url)"
          target="_blank"
          class="btn"
        >
          📄 צפייה ברזומה
        </a>

      </div>

    </div>

  </div>
</div>

<!-- מודל -->
<div class="modal-backdrop" *ngIf="selectedImage" (click)="closeImage()">

  <div class="modal-content" (click)="$event.stopPropagation()">

    <img [src]="selectedImage" />
    <button class="close-btn" (click)="closeImage()">✖</button>

  </div>

</div>
