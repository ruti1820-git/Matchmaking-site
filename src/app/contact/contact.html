<div class="contact-container">
  <h2>הוספת מועמד</h2>
  
  <input [(ngModel)]="newCandidate.name" placeholder="שם מלא" required>
  <input [(ngModel)]="newCandidate.age" type="number" placeholder="גיל" required>
  <input [(ngModel)]="newCandidate.city" placeholder="עיר">
  <textarea [(ngModel)]="newCandidate.description" placeholder="תיאור קצר"></textarea>

  <div class="file-upload">
    <label>תמונת פרופיל:</label>
    <input type="file" (change)="uploadFile($event, 'image')" accept="image/*">
    
    <label>קורות חיים (PDF):</label>
    <input type="file" (change)="uploadFile($event, 'pdf')" accept=".pdf">
  </div>

  <button (click)="saveCandidate()" [disabled]="isUploading" class="save-btn">
    {{ isUploading ? 'מעלה קבצים...' : 'שמור מועמד' }}
  </button>
</div>
